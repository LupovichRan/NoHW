name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/simple
          cp -a simple/. _site/
          # Old /NoHW/simple/ links land on the root app. No sw.js here, so
          # the old /simple/ service worker unregisters itself on update.
          cat > _site/simple/index.html <<'HTML'
          <!doctype html>
          <html lang="he" dir="rtl"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../">
          <link rel="canonical" href="../">
          <script>location.replace("../" + location.search + location.hash);</script>
          <title>Nohomework</title></head>
          <body><a href="../">Nohomework</a></body></html>
          HTML
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
